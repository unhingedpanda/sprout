name: Sprout
options:
  bundleIdPrefix: dev.unhingedpanda
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    # Sparkle compares CURRENT_PROJECT_VERSION: raise it with every release.
    MARKETING_VERSION: "0.1.2"
    CURRENT_PROJECT_VERSION: "3"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    # Off for ad hoc builds: library validation stops an ad hoc app loading Sparkle.framework.
    # scripts/release.sh turns it on with a Developer ID.
    ENABLE_HARDENED_RUNTIME: NO
    # Graphite: selection and default buttons in ink tones, never the system blue.
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.6
targets:
  Sprout:
    type: application
    platform: macOS
    sources:
      - Sources/Sprout
      - Resources
    dependencies:
      - package: Sparkle
    info:
      path: Sources/Sprout/Info.plist
      properties:
        CFBundleDisplayName: Sprout
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Updates: appcast.xml on main lists each release's DMG with its EdDSA signature.
        SUFeedURL: https://raw.githubusercontent.com/unhingedpanda/sprout/main/appcast.xml
        SUEnableAutomaticChecks: true
        # Private half: login keychain, account dev.unhingedpanda.Sprout (Sparkle's generate_keys).
        SUPublicEDKey: i+xfkQH4qXQlISk/p9RRySmRAPjbjRIrDlMq2JeLIzo=
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "GPL-3.0-or-later"
        CFBundleURLTypes:
          - CFBundleURLName: Magnet link
            CFBundleURLSchemes: [magnet]
        CFBundleDocumentTypes:
          - CFBundleTypeName: BitTorrent file
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            LSItemContentTypes: [org.bittorrent.torrent]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.bittorrent.torrent
            UTTypeDescription: BitTorrent file
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [torrent]
              public.mime-type: [application/x-bittorrent]
    settings:
      base:
        # Resources/Sprout.icon, drawn by scripts/make-icon.py (Icon Composer format).
        ASSETCATALOG_COMPILER_APPICON_NAME: Sprout
    postBuildScripts:
      - name: Embed engine
        script: '"$SRCROOT/scripts/embed-engine.sh"'
        basedOnDependencyAnalysis: false
